
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Primary SEO -->
    <title>Sharp Crackers | Sivakasi Crackers & Fireworks</title>
    <meta
      name="description"
      content="Explore Sharp Crackers, featuring a catalog of crackers and fireworks, including sparklers, flower pots, ground chakkars, rockets and gift boxes. View available products and pricing."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://sharpcrackers.com/" />
    <meta name="theme-color" content="#050a18" />

    <!-- Brand / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sharp Crackers" />
    <meta
      property="og:title"
      content="Sharp Crackers | Sivakasi Crackers & Fireworks"
    />
    <meta
      property="og:description"
      content="Explore the Sharp Crackers catalog, product details and available pricing."
    />
    <meta property="og:url" content="https://sharpcrackers.com/" />
    <meta
      property="og:image"
      content="https://sharpcrackers.com/images/sharp_crackers_brand_logo.jpg"
    />

    <!-- Google Website Name -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Sharp Crackers",
      "alternateName": "sharpcrackers",
      "url": "https://sharpcrackers.com/"
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/jpeg"
      href="/images/sharp_crackers_brand_logo.jpg"
    />
    <link
      rel="apple-touch-icon"
      href="/images/sharp_crackers_brand_logo.jpg"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
